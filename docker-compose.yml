services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adapt
      POSTGRES_PASSWORD: adapt
      POSTGRES_DB: adapt
    ports:
      - "5432:5432"
    volumes:
      - adapt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapt -d adapt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  adapt_pg_data:
